name: Post-announce

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  tag:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Push consumer-facing tags
        run: |
          v="${GITHUB_REF_NAME#changesette-v}"
          git tag "v$v"
          git tag -f "v${v%%.*}"
          git push origin "v$v"
          git push -f origin "v${v%%.*}"

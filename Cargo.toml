[package]
name = "changesette"
version = "4.0.1"
edition = "2024"
rust-version = "1.85"
description = "A version and changelog manager using the changesets file format"
homepage = "https://github.com/iorate/changesette"
repository = "https://github.com/iorate/changesette"
license = "MIT"
keywords = ["changeset", "changelog", "versioning", "release", "semver"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dialoguer = "0.12.0"
jsonc-parser = { version = "0.33.1", features = ["cst"] }
petname = { version = "3.2.0", default-features = false, features = ["default-words"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rand = "0.10.2"
regex = "1.13.1"
saphyr = "0.0.12"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shell-words = "1.1.0"
time = { version = "0.3.45", default-features = false }
wax = "0.7.0"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"

[lints.rust]
unreachable_pub = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
